spring:
  application:
    name: UserService
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      # Documents are photographs now, so a single request carries two images.
      max-file-size: ${MAX_FILE_SIZE:15MB}
      max-request-size: ${MAX_REQUEST_SIZE:30MB}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${aws.region}.amazonaws.com/${aws.cognito.user-pool-id}

server:
  port: ${PORT:8080}

aws:
  region: ${AWS_REGION:us-east-1}
  cognito:
    user-pool-id: ${USER_POOL_ID}

# ------------------------------------------------------------------------------------------------
# Shared storage microservice. The user service no longer talks to S3: it names a route and the
# storage service decides which bucket receives the object.
# ------------------------------------------------------------------------------------------------
fatum:
  file-service:
    base-url: ${FILE_SERVICE_URL:http://localhost:8081}
    internal-secret: ${FILE_SERVICE_SECRET:}
    connect-timeout: ${FILE_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${FILE_SERVICE_READ_TIMEOUT:20s}
    profile-image-route: ${FILE_SERVICE_PROFILE_IMAGE_ROUTE:user-service:profile-image}
    liveness-route: ${FILE_SERVICE_LIVENESS_ROUTE:user-service:liveness}
    document-route: ${FILE_SERVICE_DOCUMENT_ROUTE:user-service:document}

  cognito:
    enabled: ${COGNITO_GROUPS_ENABLED:true}
    user-pool-id: ${USER_POOL_ID:}
    verified-group: ${COGNITO_VERIFIED_GROUP:VERIFIED}
    professional-group: ${COGNITO_PROFESSIONAL_GROUP:PROFESSIONAL}
    use-subject-as-username: ${COGNITO_USE_SUB_AS_USERNAME:false}
    # A Cognito outage must not block a verification the database already recorded.
    strict: ${COGNITO_STRICT:false}

  # ----------------------------------------------------------------------------------------------
  # Identity verification. Every threshold is configuration so the business rules can be tuned
  # without a release.
  # ----------------------------------------------------------------------------------------------
  verification:
    enabled: ${VERIFICATION_ENABLED:true}
    max-attempts: ${VERIFICATION_MAX_ATTEMPTS:3}
    verified-threshold: ${VERIFICATION_VERIFIED_THRESHOLD:80}
    manual-threshold: ${VERIFICATION_MANUAL_THRESHOLD:30}
    hard-reject-threshold: ${VERIFICATION_HARD_REJECT_THRESHOLD:20}
    fraud-risk-threshold: ${VERIFICATION_FRAUD_RISK_THRESHOLD:70}
    min-face-match: ${VERIFICATION_MIN_FACE_MATCH:20}
    profile-photo-change-threshold: ${VERIFICATION_PROFILE_PHOTO_THRESHOLD:80}
    face-similarity-threshold: ${VERIFICATION_FACE_SIMILARITY:80}
    # Pending profile picture changes a user can queue in a day; it is a cost limit, not a security one.
    max-pending-photo-changes-per-day: ${VERIFICATION_MAX_PHOTO_CHANGES:5}
    weights:
      document-match: ${VERIFICATION_WEIGHT_DOCUMENT:0.35}
      # Weight of the document against the profile picture, the cheap check of the first phase.
      document-liveness-match: ${VERIFICATION_WEIGHT_DOCUMENT_PROFILE:0.30}
      # Weight of the live reference against the document, only used by the second phase.
      profile-liveness-match: ${VERIFICATION_WEIGHT_REFERENCE_DOCUMENT:0.20}
      authenticity: ${VERIFICATION_WEIGHT_AUTHENTICITY:0.15}
    analyzers:
      textract-enabled: ${VERIFICATION_TEXTRACT_ENABLED:true}
      rekognition-enabled: ${VERIFICATION_REKOGNITION_ENABLED:true}
      bedrock-enabled: ${VERIFICATION_BEDROCK_ENABLED:true}
      bedrock-model-id: ${VERIFICATION_BEDROCK_MODEL_ID:anthropic.claude-3-5-sonnet-20241022-v2:0}
      bedrock-max-tokens: ${VERIFICATION_BEDROCK_MAX_TOKENS:800}
      bedrock-temperature: ${VERIFICATION_BEDROCK_TEMPERATURE:0}
    # --------------------------------------------------------------------------------------------
    # Proof of life with Rekognition Face Liveness. It is the only step that costs money on every
    # attempt, and it can only be requested once the free checks have passed.
    # --------------------------------------------------------------------------------------------
    liveness:
      enabled: ${VERIFICATION_LIVENESS_ENABLED:true}
      bucket: ${S3_LIVENESS_BUCKET:}
      key-prefix: ${VERIFICATION_LIVENESS_PREFIX:liveness}
      min-confidence: ${VERIFICATION_LIVENESS_MIN_CONFIDENCE:80}
      audit-images-limit: ${VERIFICATION_LIVENESS_AUDIT_IMAGES:0}
      session-ttl: ${VERIFICATION_LIVENESS_SESSION_TTL:3m}
      max-sessions-per-attempt: ${VERIFICATION_LIVENESS_MAX_SESSIONS:3}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  lambda:
    secret: ${LAMBDA_SECRET}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

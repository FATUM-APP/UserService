spring:
  application:
    name: UserService
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${aws.region}.amazonaws.com/${aws.cognito.user-pool-id}

server:
  port: ${PORT:8080}

aws:
  region: ${AWS_REGION:us-east-1}
  cognito:
    user-pool-id: ${USER_POOL_ID}

# ------------------------------------------------------------------------------------------------
# Shared storage microservice. This service no longer talks to S3: it names a route and the storage
# service decides which bucket receives the object.
# ------------------------------------------------------------------------------------------------
fatum:
  file-service:
    base-url: ${FILE_SERVICE_URL:http://localhost:8081}
    internal-secret: ${FILE_SERVICE_SECRET:}
    connect-timeout: ${FILE_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${FILE_SERVICE_READ_TIMEOUT:20s}
    profile-image-route: ${FILE_SERVICE_PROFILE_IMAGE_ROUTE:user-service:profile-image}
    document-route: ${FILE_SERVICE_DOCUMENT_ROUTE:user-service:document}

  # Groups are the contract the rest of the platform reads, so their names are configuration.
  cognito:
    enabled: ${COGNITO_GROUPS_ENABLED:true}
    user-pool-id: ${USER_POOL_ID:}
    verified-group: ${COGNITO_VERIFIED_GROUP:VERIFIED}
    professional-group: ${COGNITO_PROFESSIONAL_GROUP:PROFESSIONAL}
    use-subject-as-username: ${COGNITO_USE_SUB_AS_USERNAME:false}
    # A Cognito outage must not fail a sign-up the database already recorded.
    strict: ${COGNITO_STRICT:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  lambda:
    secret: ${LAMBDA_SECRET}
  operation:
    allowed-locations:
      colombia:
        - bogota
        - medellin
        - cali
      mexico:
        - cdmx
        - monterrey

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html